services:
  k-on-bot:
    container_name: k-on-bot
    restart: always
    build:
      context: .
      args:
        - GIT_REPO=https://github.com/zilewang7/after-school-tea-time-telegram-bot.git
    env_file:
      - ./.env
    environment:
      - GIT_REPO=https://github.com/zilewang7/after-school-tea-time-telegram-bot.git
      - BOT_PROXY=socks5h://warp:1080
      - TZ=Asia/Shanghai
      - TGS_CONVERTER_URL=http://tgs-converter:8080
      # --- Large media (all optional; empty → current behavior, see .env) ---
      # Local Bot API server: raises getFile to 200MB. Set in .env to
      # http://telegram-bot-api:8081, then: docker compose --profile bigfile up -d
      - TG_LOCAL_API_ROOT=${TG_LOCAL_API_ROOT:-}
      # Full Vertex + GCS for >20MB media (gs:// refs). Empty → express + inline.
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      - GCS_BUCKET=${GCS_BUCKET:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/k-on-bot/gcp-sa.json
      # Link previews via luoxu's MTProto client (empty → feature off).
      - LUOXU_PREVIEW_URL=${LUOXU_PREVIEW_URL:-}
      # Mini App control panel (docs/2026-1106-2321). Kept out of .env on
      # purpose: the test instance inherits .env via dotenv and must not point
      # at the production domain. The port must match the Traefik label below.
      - WEBAPP_PORT=8080
      - WEBAPP_PUBLIC_URL=https://miniapp.heimaois.me
      - WEBAPP_BOT_SHORT_NAME=panel
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.k-on-bot-panel.rule=Host(`miniapp.heimaois.me`)"
      - "traefik.http.routers.k-on-bot-panel.entrypoints=websecure"
      - "traefik.http.routers.k-on-bot-panel.tls.certresolver=myresolver"
      - "traefik.http.routers.k-on-bot-panel.service=k-on-bot-panel"
      - "traefik.http.services.k-on-bot-panel.loadbalancer.server.port=8080"
    volumes:
      - ./database.sqlite:/app/k-on-bot/database.sqlite
      - ./.env:/app/k-on-bot/.env:ro
      # Multi-line system prompt, referenced by SYSTEM_PROMPT_FILE in .env
      - ./system-prompt.md:/app/k-on-bot/system-prompt.md:ro
      # Service account JSON for Vertex/GCS (an empty placeholder is fine until used).
      - ./gcp-sa.json:/app/k-on-bot/gcp-sa.json:ro
      # Shared with telegram-bot-api so k-on-bot can read files downloaded to disk.
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    command: ["/bin/bash", "/app/k-on-bot/build.sh"]
    working_dir: /app/k-on-bot
    # SMS MCP uses the CF-optimised hostname (cmcc-mcp-cf.heimao.icu);
    # plain cmcc-mcp.heimao.icu stays direct for China Mobile's callback.
    networks:
      - traefik-net
      # Internal-only network for the widget render sidecar (no internet there)
      - widget-render-net

  # Dev/test instance (@WatchFirstBot): runs the LOCAL working tree (no git
  # clone), its own node_modules volume (musl vs host glibc), its own sqlite
  # DB and .env.test. Start with: docker compose --profile test up -d k-on-bot-test
  k-on-bot-test:
    container_name: k-on-bot-test
    profiles: ["test"]
    image: node:22-alpine
    env_file:
      - ./.env.test
    environment:
      - BOT_PROXY=socks5h://warp:1080
      - TZ=Asia/Shanghai
      - TGS_CONVERTER_URL=http://tgs-converter:8080
      - GOOGLE_APPLICATION_CREDENTIALS=/app/k-on-bot/gcp-sa.json
      - DB_PATH=database.test.sqlite
      # Keep pnpm's store inside the container: it runs as root and would
      # otherwise create root-owned files in the mounted working tree.
      - npm_config_store_dir=/tmp/pnpm-store
      # Mini App control panel, test domain (see the k-on-bot service above).
      - WEBAPP_PORT=8080
      - WEBAPP_PUBLIC_URL=https://miniapp-test.heimaois.me
      - WEBAPP_BOT_SHORT_NAME=panel
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.k-on-bot-test-panel.rule=Host(`miniapp-test.heimaois.me`)"
      - "traefik.http.routers.k-on-bot-test-panel.entrypoints=websecure"
      - "traefik.http.routers.k-on-bot-test-panel.tls.certresolver=myresolver"
      - "traefik.http.routers.k-on-bot-test-panel.service=k-on-bot-test-panel"
      - "traefik.http.services.k-on-bot-test-panel.loadbalancer.server.port=8080"
    volumes:
      - .:/app/k-on-bot
      - k-on-bot-test-node-modules:/app/k-on-bot/node_modules
      # The webapp's deps and build output stay in volumes too, so the root
      # container never writes them into the mounted working tree.
      - k-on-bot-test-webapp-node-modules:/app/k-on-bot/webapp/node_modules
      - k-on-bot-test-webapp-dist:/app/k-on-bot/webapp/dist
      # matches the package.json "link:../../projects/telegram-md-entities"
      - /home/ubuntu/projects/telegram-md-entities:/projects/telegram-md-entities:ro
    command:
      [
        "/bin/sh",
        "-c",
        "npm install -g corepack && corepack prepare pnpm@9.4.0 --activate && pnpm install && pnpm build && node dist/index.js",
      ]
    working_dir: /app/k-on-bot
    networks:
      - traefik-net
      - widget-render-net

  # Converts Telegram .tgs animated stickers to .webm for multimodal models.
  # Opt-in via COMPOSE_PROFILES (default includes 'tgs' in .env.example).
  tgs-converter:
    container_name: tgs-converter
    restart: always
    profiles: ["tgs"]
    build:
      context: ./tgs-converter
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1536m
    cpus: 2.0
    tmpfs:
      - /tmp:size=536870912,mode=1777
    environment:
      - TZ=Asia/Shanghai
      - NODE_OPTIONS=--max-old-space-size=384
      - CACHE_MAX_BYTES=67108864
      - MAX_EXPENSIVE_PROCESSES=3
      - MAX_EXPENSIVE_QUEUE=32
    networks:
      - traefik-net

  # Renders widget HTML to PNG (Chromium + CJK fonts, no npm deps).
  # Internal network only: it serves k-on-bot, never the internet, and has no
  # secrets. Used for the bot's own context image, group-chat link previews and
  # share-page preview cards. Safe to leave running: idle CPU is ~0.
  widget-render:
    container_name: widget-render
    restart: always
    build:
      context: ./widget-render
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    tmpfs:
      - /tmp:size=268435456,mode=1777
    environment:
      - TZ=Asia/Shanghai
      - PORT=8099
    networks:
      - widget-render-net

  # Self-hosted Telegram Bot API (--local): getFile up to 2GB, returns on-disk
  # paths shared via telegram-bot-api-data. Opt-in via COMPOSE_PROFILES=bigfile in
  # .env — then a plain `docker compose up -d` starts it (no --profile flag needed).
  # Requires TG_API_ID / TG_API_HASH in .env (reuse luoxu's api_id/api_hash).
  telegram-bot-api:
    container_name: telegram-bot-api
    # Pin the Bot API version: 'latest' proved stale (a June image predating
    # Bot API 10.1 silently dropped incoming rich messages).
    image: aiogram/telegram-bot-api:10.2
    restart: always
    profiles: ["bigfile"]
    environment:
      - TELEGRAM_API_ID=${TG_API_ID:-}
      - TELEGRAM_API_HASH=${TG_API_HASH:-}
      - TELEGRAM_LOCAL=1
      - TZ=Asia/Shanghai
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true
  # No gateway to the internet: Chromium can only talk to the bot container
  widget-render-net:
    internal: true

volumes:
  telegram-bot-api-data:
  k-on-bot-test-node-modules:
  k-on-bot-test-webapp-node-modules:
  k-on-bot-test-webapp-dist:
