<!doctype html>
<html>
<body>
<section class="CbirSection CbirTags" aria-labelledby="cbir-tags-title">
  <h2 id="cbir-tags-title" class="CbirSection-Title">Image appears to contain</h2>
  <div class="Tags Tags_type_simple Tags_view_buttons">
    <div class="Tags-Wrapper Tags-Wrapper_clip Tags-Wrapper_flow_wrap">
      <a class="Button Button_pin_circle-circle Button_width_auto Button_view_pseudo Button_size_l Button_link Tags-Item" href="/images/search?text=dog"><span class="Button-Text">собака</span></a>
      <a class="Button Button_pin_circle-circle Button_width_auto Button_view_pseudo Button_size_l Button_link Tags-Item" href="/images/search?text=shiba"><span class="Button-Text">сиба-ину</span></a>
      <a class="Button Button_pin_circle-circle Button_width_auto Button_view_pseudo Button_size_l Button_link Tags-Item" href="/images/search?text=meme"><span class="Button-Text">dog &amp; meme</span></a>
      <button aria-label="Show more" aria-expanded="false" type="button" class="Button Button_pin_circle-circle Button_width_auto Button_view_pseudo Button_size_l Tags-More Tags-Item" autoComplete="off"><span class="Icon Icon_size_s Icon_type_more-horizontal Button-Icon" aria-hidden="true"></span></button>
    </div>
  </div>
</section>
<section class="CbirSection CbirOtherSizes" aria-labelledby="cbir-sizes-title">
  <h2 id="cbir-sizes-title" class="CbirSection-Title">In other sizes</h2>
  <div class="CbirOtherSizes-Wrapper">
    <div class="CbirOtherSizes-FlatItems">
      <a target="_blank" rel="noopener" href="https://cdn.example.com/original.jpg?w=5800&amp;h=4350" aria-label="5800 на 4350" type="button" class="Button Button_pin_circle-circle Button_width_auto Button_view_pseudo Button_size_l Button_link Tags-Item" autoComplete="off"><span class="Button-Text">5800×4350</span></a>
      <a target="_blank" rel="noopener" href="https://cdn.example.com/small.jpg" aria-label="800 на 600" type="button" class="Button Button_pin_circle-circle Button_width_auto Button_view_pseudo Button_size_l Button_link Tags-Item" autoComplete="off"><span class="Button-Text">800×600</span></a>
      <a target="_blank" rel="noopener" href="https://cdn.example.com/original.jpg?w=5800&amp;h=4350" aria-label="5800 на 4350" type="button" class="Button Button_pin_circle-circle Button_width_auto Button_view_pseudo Button_size_l Button_link Tags-Item" autoComplete="off"><span class="Button-Text">5800×4350</span></a>
    </div>
  </div>
</section>
<section class="CbirSection CbirSimilarList" aria-labelledby="cbir-similar-title">
  <h2 id="cbir-similar-title" class="CbirSection-Title"><a class="Link Link_view_primary CbirSimilarList-TitleLink" href="/images/search?rpt=imageview&amp;cbir_id=1%2Fabc&amp;cbir_page=similar">Similar images</a></h2>
  <div class="CbirSimilarList-Thumbs">
    <div class="JustifierRowLayout">
      <div class="CbirSimilarList-Thumb" style="width:133px;height:100px">
        <a href="/images/search?img_url=https%3A%2F%2Fcdn.example.com%2Fsimilar-1.jpg&amp;cbir_id=1%2Fabc&amp;cbir_page=similar" class="Link Thumb Thumb_hover_fade Thumb_shade Thumb_rounded Thumb_type_block CbirSimilarList-ThumbImage Thumb_lazy" target="_blank">
          <div class="Image Image_fit_cover Thumb-Image" role="img" aria-label="相似图一"></div>
        </a>
      </div>
      <div class="CbirSimilarList-Thumb" style="width:73px;height:100px">
        <a href="/images/search?img_url=https%3A%2F%2Fcdn.example.com%2Fsimilar-2.jpg%3Fw%3D200&amp;cbir_id=1%2Fabc&amp;cbir_page=similar" class="Link Thumb Thumb_hover_fade Thumb_shade Thumb_rounded Thumb_type_block CbirSimilarList-ThumbImage Thumb_lazy" target="_blank">
          <div class="Image Image_fit_cover Thumb-Image" role="img" aria-label="Similar &amp; second"></div>
        </a>
      </div>
      <div class="CbirSimilarList-Thumb" style="width:73px;height:100px">
        <a href="/images/search?img_url=https%3A%2F%2Fcdn.example.com%2Fsimilar-3.jpg&amp;cbir_id=1%2Fabc&amp;cbir_page=similar" class="Link Thumb Thumb_hover_fade Thumb_shade Thumb_rounded Thumb_type_block CbirSimilarList-ThumbImage Thumb_lazy" target="_blank">
          <div class="Image Image_fit_cover Thumb-Image" role="img"></div>
        </a>
      </div>
    </div>
  </div>
</section>
<section class="CbirSection CbirSitesList" aria-labelledby="cbir-sites-title">
  <h2 id="cbir-sites-title" class="CbirSection-Title">Sites</h2>
  <ul class="CbirSites-Items">
    <li class="CbirSites-Item">
      <div class="CbirSites-ItemThumb" aria-hidden="true"><a href="https://cdn.example.com/original.jpg" class="Link Thumb"><img class="Image Thumb-Image" src="//avatars.mds.yandex.net/i?id=1&amp;n=13" width="148" height="90" alt="来源一"><div class="Thumb-Mark Typo Typo_text_s">687×1024</div></a></div>
      <div class="CbirSites-ItemInfo">
        <div class="CbirSites-ItemTitle"><a href="https://example.com/page-1?utm_medium=organic&amp;utm_source=yandexsmartcamera" target="_blank" class="Link Link_view_default">来源一 &amp; 标题</a></div>
        <a class="Link Link_view_outer CbirSites-ItemDomain CbirSites-ItemDomain_withFavicon" href="https://example.com/page-1" target="_blank" aria-hidden="true"><div class="FaviconSprite-Icon CbirSites-ItemFavicon" aria-hidden="true"></div>example.com</a>
        <div class="CbirSites-ItemDescription" aria-hidden="true">描述一 &#x27;quoted&#x27;</div>
      </div>
    </li>
    <li class="CbirSites-Item">
      <div class="CbirSites-ItemThumb" aria-hidden="true"><a href="https://cdn.example.com/original.jpg" class="Link Thumb"><img class="Image Thumb-Image" src="//avatars.mds.yandex.net/i?id=2&amp;n=13" width="148" height="90" alt="来源二"><div class="Thumb-Mark Typo Typo_text_s">687×1024</div></a></div>
      <div class="CbirSites-ItemInfo">
        <div class="CbirSites-ItemTitle"><a href="https://example.org/page-2" target="_blank" class="Link Link_view_default">来源二</a></div>
        <a class="Link Link_view_outer CbirSites-ItemDomain CbirSites-ItemDomain_withFavicon" href="https://example.org/page-2" target="_blank" aria-hidden="true"><div class="FaviconSprite-Icon CbirSites-ItemFavicon" aria-hidden="true"></div>example.org</a>
        <div class="CbirSites-ItemDescription" aria-hidden="true"></div>
      </div>
    </li>
  </ul>
</section>
</body>
</html>
