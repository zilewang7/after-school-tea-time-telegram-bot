schema = 2

[cost.text.input]
price = 2
cache = { read = 0.2, write = { "5m" = 2.5, "1h" = 4 } }

[cost.text.output]
price = 10

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { region = { equals = "us" } }
factor = { text = 1.1 }

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none", "required", "tool"] }
reasoning = { supported = true, toggle = true, effort = ["low", "medium", "high", "xhigh", "max"] }
structured_output = true
temperature = false
cache = { explicit = { ttl = ["5m", "1h"], max_breakpoints = 4, targets = ["tools", "system", "messages"], min_tokens = 1_024 } }

[limit]
context = 1_000_000
output = 128_000

[api.messages]
capabilities = { system_updates = true, tools = { strict = true, search = true } }

[api.chat-completions]
base_url = "https://api.anthropic.com/v1"
sdk = { aisdk = "@ai-sdk/openai-compatible", opencodeai = "@opencode/ai/providers/openai-compatible" }
