schema = 2

[cost.text.input]
price = 0.1
cache = { read = 0.01, write = { "30m" = 0.125, "12h" = 0.25 } }

[[cost.text.input.overrides]]
when = { context = { gt = 272_000 } }
price = 0.2
cache = { read = 0.02, write = { "30m" = 0.25, "12h" = 0.5 } }

[cost.text.output]
price = 0.5

[[cost.text.output.overrides]]
when = { context = { gt = 272_000 } }
price = 0.75

[cost.web_search]
price = 10

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }

[[cost.multipliers]]
when = { service_tier = { equals = "flex" } }
factor = { text = 0.5 }

[[cost.multipliers]]
when = { not = { region = { equals = "global" } } }
factor = { text = 1.1 }

[capabilities]
tools = { supported = true }
reasoning = { supported = true, effort = ["none", "low", "medium", "high", "xhigh", "max"] }
structured_output = true
store = true
cache = { implicit = { min_tokens = 1_024 }, explicit = { ttl = ["30m", "12h"], max_breakpoints = 4, min_tokens = 1_024 } }
prompt_cache_key = true
service_tier = ["flex", "priority"]

[api.responses]
capabilities = { system_updates = true, effort_updates = true, tools = { strict = true, choice = ["auto", "none", "required", "tool"], search = true, freeform = ["text", "lark", "regex"], updates = true } }

[api.chat-completions]
sdk = { opencodeai = "@opencode/ai/providers/openai/chat" }
capabilities = { system_updates = true, tools = { strict = true, choice = ["auto", "none", "required", "tool"], freeform = ["text", "lark", "regex"] } }

[api.decisions]
sdk = { opencodeai = "@opencode/ai/protocols/openai-decisions" }
