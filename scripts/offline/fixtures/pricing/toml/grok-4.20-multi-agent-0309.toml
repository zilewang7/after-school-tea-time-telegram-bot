schema = 2

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gte = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gte = 200_000 } }
price = 5

[cost.web_search]
price = 5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }

[modalities]
input = ["text", "image/jpeg", "image/png", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true, effort = ["low", "medium", "high", "xhigh"] }
structured_output = true
temperature = true
top_p = true
top_k = true
system_updates = true
store = true
prompt_cache_key = true
cache = { implicit = true }
service_tier = ["priority"]

[limit]
context = 1_000_000
output = 30_000

[api.responses]
