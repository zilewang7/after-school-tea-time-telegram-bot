schema = 2

[cost.text.input]
price = 1.25
cache = { read = 0.2 }

[[cost.text.input.overrides]]
when = { context = { gte = 200_000 } }
price = 2.5
cache = { read = 0.4 }

[cost.text.output]
price = 2.5

[[cost.text.output.overrides]]
when = { context = { gte = 200_000 } }
price = 5

[cost.web_search]
price = 5

[[cost.multipliers]]
when = { service_tier = { equals = "priority" } }
factor = { text = 2 }
